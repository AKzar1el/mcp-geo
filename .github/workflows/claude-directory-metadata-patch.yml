name: Apply Claude directory metadata patch

on:
  push:
    branches:
      - chore/claude-directory-metadata
    paths:
      - .github/workflows/claude-directory-metadata-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/claude-directory-metadata

      - name: Classify refresh side effects
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/core/tools.ts')
          text = path.read_text()
          marker = "toolName('refresh_brand')"
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('refresh_brand registration not found')

          prefix = text[:marker_index]
          tail = text[marker_index:]
          old = "      annotations: {\n        readOnlyHint: false,\n        openWorldHint: true,\n      },"
          new = "      annotations: {\n        readOnlyHint: false,\n        destructiveHint: true,\n        openWorldHint: true,\n      },"
          if old not in tail:
              raise SystemExit('refresh_brand annotation block not found')
          tail = tail.replace(old, new, 1)
          path.write_text(prefix + tail)
          PY

      - name: Commit source-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/tools.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: classify visibility refresh as destructive"
          git push origin HEAD:chore/claude-directory-metadata
