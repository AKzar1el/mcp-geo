name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Worker + Node configs)
        run: npm run typecheck

      - name: Unit tests (matching, citations, scoring, sqlite adapter)
        run: npm run test:unit

      - name: Build the stdio CLI
        run: npm run build

      - name: stdio smoke test (spawns dist/cli.js over JSON-RPC)
        run: npm run test:stdio
