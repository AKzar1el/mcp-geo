name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Worker + Node configs)
        run: npm run typecheck

      - name: Unit tests (sqlite adapter)
        run: npm run test:unit

      - name: Build the stdio CLI
        run: npm run build

      - name: stdio smoke test (spawns dist/cli.js over JSON-RPC)
        run: npm run test:stdio
