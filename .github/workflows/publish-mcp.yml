# Publishes release artifacts to npm and the official MCP Registry.
# Registry metadata changes on main can also publish the already-existing
# package/version without attempting an immutable npm republish.

name: Publish (npm + MCP Registry)

on:
  pull_request:
    paths:
      - server.json
      - package.json
      - manifest.json
      - .github/workflows/publish-mcp.yml
  push:
    branches:
      - main
    paths:
      - server.json
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify package and manifest version alignment
        run: |
          PKG=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG_NAME=$(node -p "require('./server.json').packages[0].identifier")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          MANIFEST=$(node -p "require('./manifest.json').version")
          echo "package.json=$PKG_NAME@$PKG server.json=$SRV server.json#packages[0]=$SRV_PKG_NAME@$SRV_PKG manifest.json=$MANIFEST"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRV_PKG" ] || [ "$PKG_NAME" != "$SRV_PKG_NAME" ]; then
            echo "::error::package drift: package.json=$PKG_NAME@$PKG but server.json=$SRV_PKG_NAME@$SRV_PKG (server version=$SRV)"
            exit 1
          fi
          if [ "$PKG" != "$MANIFEST" ]; then
            echo "::warning::manifest.json version ($MANIFEST) differs from package.json ($PKG)"
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

  publish-npm:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs typecheck + unit tests + build before the tarball is created.
      - name: Publish to npm
        run: npm publish --access public

  publish-mcpb:
    name: Publish Claude Desktop MCPB asset
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MCPB release asset
        id: mcpb
        shell: bash
        run: |
          npm run build
          npm run mcpb:pack
          VERSION=$(node -p "require('./package.json').version")
          SOURCE=$(find . -maxdepth 1 -type f -name '*.mcpb' -print -quit)
          if [ -z "$SOURCE" ]; then
            echo "::error::mcpb:pack did not produce a top-level .mcpb asset"
            exit 1
          fi
          ASSET="digestseo-mcp-$VERSION.mcpb"
          mv "$SOURCE" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload MCPB to this release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.mcpb.outputs.asset }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "$ASSET already exists on $GITHUB_REF_NAME; leaving it unchanged"
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "$ASSET"

  check-npm-version:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.package.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Check whether the declared npm version already exists
        id: package
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-mcp-registry:
    name: Publish to official MCP Registry
    needs: [validate, publish-npm, check-npm-version]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (((github.event_name == 'release' || github.event_name == 'workflow_dispatch') && needs.publish-npm.result == 'success') ||
       (github.event_name == 'push' && needs.check-npm-version.outputs.published == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Login to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Wait for npm package propagation
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in {1..12}; do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is visible on npm"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::$PKG@$VERSION is still not visible on npm after bounded propagation wait"
              exit 1
            fi
            sleep 5
          done

      - name: Publish server.json
        run: ./mcp-publisher publish server.json
