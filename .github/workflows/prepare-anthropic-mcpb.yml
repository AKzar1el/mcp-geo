name: Prepare Anthropic MCPB metadata

on:
  push:
    branches:
      - chore/anthropic-mcpb-directory

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/anthropic-mcpb-directory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply local-tool metadata only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/core/tools.ts';
          let source = fs.readFileSync(path, 'utf8');

          function patchTool(name, title, annotations) {
            const marker = `server.registerTool(\n    '${name}',`;
            const start = source.indexOf(marker);
            if (start < 0) throw new Error(`Missing tool marker: ${name}`);
            const next = source.indexOf('\n  server.registerTool(', start + marker.length);
            const end = next < 0 ? source.length : next;
            let block = source.slice(start, end);
            const descriptionMarker = `    {\n      description:`;
            if (!block.includes(descriptionMarker)) throw new Error(`Missing description marker: ${name}`);
            block = block.replace(descriptionMarker, `    {\n      title: '${title}',\n      description:`);
            const annotationsPattern = /      annotations: \{\n(?:        .*\n)+?      \},/;
            if (!annotationsPattern.test(block)) throw new Error(`Missing annotations block: ${name}`);
            const lines = Object.entries(annotations)
              .map(([key, value]) => `        ${key}: ${value},`)
              .join('\n');
            block = block.replace(annotationsPattern, `      annotations: {\n${lines}\n      },`);
            source = source.slice(0, start) + block + source.slice(end);
          }

          patchTool('track_brand', 'Track a brand', {
            readOnlyHint: false,
            destructiveHint: false,
            idempotentHint: true,
            openWorldHint: true,
          });
          patchTool('list_brands', 'List tracked brands', {
            readOnlyHint: true,
            destructiveHint: false,
            idempotentHint: true,
            openWorldHint: false,
          });
          patchTool('generate_prompts', 'Generate brand prompts', {
            readOnlyHint: false,
            destructiveHint: true,
            idempotentHint: false,
            openWorldHint: true,
          });

          fs.writeFileSync(path, source);
          NODE

      - name: Normalize MCPB manifest to current static-tool schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.manifest_version = '0.3';
          manifest.tools = (manifest.tools ?? []).map(({ name, description }) => ({
            name,
            ...(description ? { description } : {}),
          }));
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Verify full project
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build
          npm run test:stdio

      - name: Capture MCPB manifest validation
        shell: bash
        run: |
          set +e
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json > mcpb-validation.txt 2>&1
          STATUS=$?
          set -e
          cat mcpb-validation.txt
          if [ "$STATUS" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add mcpb-validation.txt
            git commit -m "chore: capture MCPB validation diagnostics"
            git push origin HEAD:chore/anthropic-mcpb-directory
            exit "$STATUS"
          fi

      - name: Commit verified MCPB metadata
        run: |
          rm -f mcpb-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/tools.ts manifest.json
          git commit -m "chore: align local MCPB directory metadata"
          git push origin HEAD:chore/anthropic-mcpb-directory
